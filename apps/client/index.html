<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Clash - 2D Fighting Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0c10;
      color: #c5c6c7;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 95vw;
      max-width: 1280px;
      height: calc(95vw * 9 / 16);
      max-height: 720px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(102, 252, 241, 0.2);
      border: 2px solid #1f2833;
      border-radius: 4px;
      background-color: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      pointer-events: auto;
    }
    .status-text {
      font-size: 14px;
      color: #66fcf1;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: rgba(0, 0, 0, 0.5);
      padding: 5px 10px;
      border-radius: 4px;
    }

    #touch-controls {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      padding: 0 40px;
      pointer-events: none;
      justify-content: space-between;
      z-index: 10;
    }
    
    @media (pointer: coarse) {
      #touch-controls {
        display: flex;
      }
    }
    
    .show-touch #touch-controls {
      display: flex;
    }

    .touch-group {
      display: grid;
      pointer-events: auto;
      gap: 10px;
    }
    
    .left-group {
      grid-template-areas: 
        ". up ."
        "left . right"
        ". down .";
      width: 165px;
      height: 165px;
    }
    
    .right-group {
      grid-template-areas: 
        "grab block ."
        "light heavy special";
      width: 225px;
      height: 165px;
      align-content: end;
    }

    .touch-btn {
      width: 48px;
      height: 48px;
      background: rgba(31, 40, 51, 0.6);
      border: 2px solid #66fcf1;
      border-radius: 50%;
      color: #66fcf1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: background 0.1s, transform 0.1s;
    }
    
    .touch-btn:active {
      background: rgba(102, 252, 241, 0.4);
      transform: scale(0.9);
      color: #ffffff;
      border-color: #ffffff;
    }
    
    .btn-up { grid-area: up; }
    .btn-left { grid-area: left; }
    .btn-right { grid-area: right; }
    .btn-down { grid-area: down; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-layer">
      <div class="hud-header">
        <div id="server-status" class="status-text">Server: Connecting...</div>
        <div id="game-fps" class="status-text">FPS: --</div>
      </div>
    </div>
    <div id="touch-controls">
      <div class="touch-group left-group">
        <div class="touch-btn btn-up" data-action="up">▲</div>
        <div class="touch-btn btn-left" data-action="left">◀</div>
        <div class="touch-btn btn-right" data-action="right">▶</div>
        <div class="touch-btn btn-down" data-action="down">▼</div>
      </div>
      <div class="touch-group right-group">
        <div class="touch-btn btn-action" style="grid-area: grab;" data-action="grab">G</div>
        <div class="touch-btn btn-action" style="grid-area: block;" data-action="block">B</div>
        <div class="touch-btn btn-action" style="grid-area: light;" data-action="lightAttack">L</div>
        <div class="touch-btn btn-action" style="grid-area: heavy;" data-action="heavyAttack">H</div>
        <div class="touch-btn btn-action" style="grid-area: special;" data-action="specialAttack">S</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
